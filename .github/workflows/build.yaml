name: build
on: push
jobs:
  build:
    # push, or pull_request from fork
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          architecture: x64
          distribution: temurin
          cache: maven
      # One pass instead of four parallel jobs: they shared no local repository, so on a cache miss each of them
      # downloaded the whole dependency tree again.
      # No --update-snapshots: nothing in the effective POM is a SNAPSHOT (the matsim parent is a pinned release),
      # so it has nothing to update, while it forces every repository to be re-asked for metadata and for artifacts
      # whose absence is already cached. Add it back when pinning a SNAPSHOT parent.
      - run: mvn --batch-mode package checkstyle:checkstyle enforcer:enforce -Dmatsim.preferLocalDtds=true -Dmaven.javadoc.skip -e
      - run: mkdir staging && cp *.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging
      - uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: target/site/jacoco/
    env:
      # Bound how long a single unresponsive repository can hold up resolution.
      # Set for both the default resolver transport and wagon, whichever ends up being used.
      MAVEN_OPTS: >-
        -Xmx512m
        -Daether.connector.connectTimeout=5000
        -Daether.connector.requestTimeout=30000
        -Dmaven.wagon.http.connectionTimeout=5000
        -Dmaven.wagon.http.readTimeout=30000
